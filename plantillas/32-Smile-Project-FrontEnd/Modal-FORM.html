<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <!-- appointment button  -->
              <button type="button" class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#exampleModal">Book An Appointment</button>
              <div class="modal fade" style="background-color: rgba(0, 0, 0, 0.699);" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                      <div class="modal-content">
                      <div class="modal-header">
                      <h1 class="modal-title fs-5 text-center" id="exampleModalLabel">Book An Appointment</h1>  
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                          </div>
                          
                <div class="modal-body">
                  <form>
                      <div class="input-group">
                          <input type="text" aria-label="Full Name" class="form-control" placeholder="Patient Full Name" pattern="[A-Za-z]{3}" title="Three letter country code" required>
                        </div>
                      <div class="input-group mt-3">
                          <input type="number" aria-label="Full Name" class="form-control" placeholder="Patient Age" pattern="[A-Za-z]{3}" title="Three letter country code" required>
                        </div>
                          <div class="input-group mb-3 mt-3">
                              <select class="form-select" id="inputGroupSelect01" required>
                                <option value="1">Male</option>
                                <option value="2">Female</option>
                                <option value="2">Custom</option>
                              </select>
                            </div>
                            <div class="input-group mt-3">
                              <input type="number" aria-label="Full Name" class="form-control" placeholder="Contact Number">
                            </div>
                            <div class="input-group mt-3">
                              <label class="mt-2">Appointment Date</label><br>
                              <input type="date" aria-label="Full Name" class="form-control text-uppercase" placeholder="Appointment Date" required>
                            </div>
                            <div class="input-group mt-3">
                              <input type="email" aria-label="Full Name" class="form-control" placeholder="E-mail (123abc@gmail.com)">
                            </div>
                            
                              <div class="mb-3">
                                  <label for="message-text" class="col-form-label">Important Note For Dentist:</label>
                                  <textarea class="form-control" id="message-text"></textarea>
                              </div>
                  </form>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="submit" class="btn btn-primary">Confirm</button>
                </div>
              </div>
            </div>
          </div>
<script>

  </script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
